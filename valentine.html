<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Veux-tu être ma Valentine ? 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
  background: linear-gradient(120deg, #ff9a9e, #fad0c4);
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  width: 320px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 36px;
  color: #c2185b;
}

.buttons {
  margin-top: 25px;
  position: relative;
  height: 120px;
}

button {
  padding: 12px 22px;
  border-radius: 25px;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

#yes {
  background: #e91e63;
  color: white;
}

#no {
  background: #555;
  color: white;
  position: absolute;
  left: 120px;
  top: 60px;
}

.poem {
  display: none;
  margin-top: 20px;
  font-family: 'Great Vibes', cursive;
  font-size: 24px;
  color: #b0004e;
}
</style>
</head>

<body>

<div class="card">
  <h1>Veux-tu être ma Valentine Habibi ? 💌</h1>

  <div class="buttons">
    <button id="yes" onclick="sayYes()">💖 OUI</button>
    <button id="no">💔 NON</button>
  </div>

  <div class="poem" id="poem">
    Merci pour ton amour si précieux,  
    <br>Pour chaque sourire, chaque instant heureux.  
    <br>À tes côtés, mon cœur a trouvé sa maison,  
    <br>Je t’aime aujourd’hui, demain, et pour chaque saison. 🌹
  </div>
</div>

<script>
// Bouton NON qui fuit
const noBtn = document.getElementById("no");

function moveButton() {
  const x = Math.random() * 220;
  const y = Math.random() * 80;
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

// Bouton OUI
function sayYes() {
  document.querySelector(".buttons").style.display = "none";
  document.getElementById("poem").style.display = "block";
}
</script>

</body>
</html>
